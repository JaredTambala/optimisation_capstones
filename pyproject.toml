[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optimisation-capstones-control"
version = "0.3.0"
description = "Private control tooling for the CAP-001 optimisation capstone"
requires-python = ">=3.12"
dependencies = [
  "highspy>=1.8,<2",
  "pyomo>=6.9,<7",
]

[project.optional-dependencies]
audit = [
  "jsonschema>=4.23,<5",
  "python-docx>=1.1,<2",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["cap001_model*", "tooling*"]
